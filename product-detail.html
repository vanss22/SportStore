            p007: {

                image: "https://contents.mediadecathlon.com/p2939822/k$583450201f8b8586ae927c3401603bcc/matras-yoga-comfort-173-cm-61-cm-8-mm-palm-biru-tua-kimjaly-8665059.jpg",
                description: "Matras yoga anti-slip berkualitas tinggi, nyaman dan tahan lama untuk sesi yoga Anda."

            p008: {

                price: "Rp 450.000",
                image: "https://images.unsplash.com/photo-1638536532686-d610adfc8e5c?w=400",
                description: "Set dumbbell 10kg berkualitas untuk latihan kekuatan dan kebugaran di rumah."
            },
            p009: {
                name: "Sepatu Basket Air Jump",

            }
        };

        function getProductIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

      
        function displayProduct(productId) {
            const product = products[productId];
            
            if (product) {
                document.getElementById('product-image').src = product.image;
                document.getElementById('product-name').textContent = product.name;
                document.getElementById('product-price').textContent = product.price;
                document.getElementById('product-description').textContent = product.description;
                document.title = product.name + " - Sport Store";
            } else {
              
                document.getElementById('product-name').textContent = "Produk tidak ditemukan";
                document.getElementById('product-description').textContent = "Maaf, produk yang Anda cari tidak tersedia.";
            }
        }

        
        window.addEventListener('DOMContentLoaded', function() {
            const productId = getProductIdFromURL();
            if (productId) {
                displayProduct(productId);
            }
        });
    </script>
