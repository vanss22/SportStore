<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - Sport Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #dc3545; }
        .nav-link:hover { border-bottom: 2px solid #dc3545; color: #dc3545 !important; }
        .btn-danger { background-color: #dc3545; border: none; }
        .size-badge { cursor: pointer; transition: 0.2s; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><span class="text-danger">Sport Store</span></a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto me-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Produk</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Tentang</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Kontak</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html"><i class="fas fa-shopping-cart"></i> <span id="cart-item-count" class="badge bg-danger rounded-pill d-none"></span></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-5">
            <div class="col-md-6">
                <img id="product-image" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" class="img-fluid rounded shadow-sm" alt="Produk">
            </div>
            <div class="col-md-6">
                <h2 id="product-name" class="fw-bold">Sepatu Lari UltraBoost</h2>
                <h3 id="product-price" class="text-danger fw-bold my-3">Rp 1.500.000</h3>
                <p id="product-description" class="text-muted">Sepatu lari berkualitas tinggi dengan teknologi UltraBoost untuk kenyamanan maksimal.</p>

                <div class="my-4">
                    <h6>Pilih Ukuran:</h6>
                    <div id="size-options" class="btn-group" role="group">
                        <input type="radio" class="btn-check" name="size" id="s1" value="40" checked><label class="btn btn-outline-danger" for="s1">40</label>
                        <input type="radio" class="btn-check" name="size" id="s2" value="41"><label class="btn btn-outline-danger" for="s2">41</label>
                        <input type="radio" class="btn-check" name="size" id="s3" value="42"><label class="btn btn-outline-danger" for="s3">42</label>
                    </div>
                </div>

                <div class="d-flex gap-3 mb-4">
                    <input id="product-quantity" type="number" class="form-control" style="width: 80px" value="1" min="1">
                    <button id="add-to-cart-btn" class="btn btn-danger flex-grow-1"><i class="fas fa-cart-plus me-2"></i>Tambah ke Keranjang</button>
                </div>
                
                <div class="card border-0 bg-light p-3">
                    <p class="mb-1"><i class="fas fa-check-circle text-success me-2"></i> Stok Tersedia</p>
                    <p class="mb-0"><i class="fas fa-truck text-primary me-2"></i> Gratis Ongkir Wilayah Jawa</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container"><p class="mb-0">&copy; 2026 Sport Store. Semua hak dilindungi.</p></div>
    </footer>
</body>
</html>
