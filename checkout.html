<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const CART_KEY = 'sportStoreCart';
  function getCart(){ try{ const d = localStorage.getItem(CART_KEY); return d?JSON.parse(d):[] }catch(e){return[]} }
  function saveCart(c){ localStorage.setItem(CART_KEY, JSON.stringify(c)); }
  function formatPrice(v){ return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v); }

  function renderSummary(){
    const cart = getCart();
    const itemsEl = document.getElementById('itemsList'); itemsEl.innerHTML='';
    let subtotal=0;
    if(cart.length===0){ itemsEl.innerHTML='<p class="text-muted">Tidak ada produk di keranjang.</p>'; }
    cart.forEach(it=>{
      const row = document.createElement('div'); row.className='d-flex justify-content-between mb-2';
      row.innerHTML = `<div><div class="fw-semibold">${it.name}</div><small class="text-muted">x${it.quantity}</small></div><div class="text-end">${formatPrice(it.price*it.quantity)}</div>`;
      itemsEl.appendChild(row);
      subtotal += it.price * it.quantity;
    });
    document.getElementById('subtotalText').textContent = formatPrice(subtotal);
    const shipping = subtotal>0?0:0;
    document.getElementById('shippingText').textContent = formatPrice(shipping);
    document.getElementById('discountText').textContent = formatPrice(0);
    document.getElementById('totalText').textContent = formatPrice(subtotal+shipping-0);
  }

  function generateVA(){ return Math.floor(1000000000 + Math.random()*9000000000); }

  document.getElementById('payNowBtn').addEventListener('click', function(){
    const cart = getCart();
    if(cart.length===0){ alert('Keranjang kosong.'); return; }
    const method = document.querySelector('input[name="paymentMethod"]:checked').value;
    const totals = cart.reduce((s,i)=>s+i.price*i.quantity,0);
    const orderId = 'ORD'+Date.now();
    document.getElementById('pmOrderId').textContent = orderId;
    document.getElementById('pmAmount').textContent = formatPrice(totals);
    const details = document.getElementById('pmDetails'); details.innerHTML='';
    if(method.startsWith('bank_')){
      const bank = method.split('_')[1].toUpperCase();
      const va = generateVA();
      details.innerHTML = `<p>Silakan transfer ke ${bank} (Virtual Account): <strong>${va}</strong></p><p>Jumlah tepat: <strong>${formatPrice(totals)}</strong></p>`;
    } else {
      const wallets = { gopay:'GoPay', ovo:'OVO', dana:'DANA' };
      const name = wallets[method]||method;
      const id = '0812'+Math.floor(10000000+Math.random()*90000000);
      details.innerHTML = `<p>Bayar via ${name} ke ID: <strong>${id}</strong></p><p>Scan QR atau transfer sebesar <strong>${formatPrice(totals)}</strong></p>`;
    }
    const pm = new bootstrap.Modal(document.getElementById('paymentModal'));
    pm.show();
  });

  document.getElementById('pmDone').addEventListener('click', function(){
    // Finish: clear cart and show confirmation
    saveCart([]);
    renderSummary();
    const modalEl = document.getElementById('paymentModal');
    const bs = bootstrap.Modal.getInstance(modalEl); if(bs) bs.hide();
    const toast = document.createElement('div'); toast.className='toast align-items-center text-bg-success border-0 position-fixed top-0 end-0 m-3'; toast.role='alert';
    toast.innerHTML = `<div class="d-flex"><div class="toast-body">Pembayaran diterima. Terima kasih!</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>`;
    document.body.appendChild(toast);
    bootstrap.Toast.getOrCreateInstance(toast, { delay: 2500 }).show();
  });

  document.addEventListener('DOMContentLoaded', function(){ renderSummary(); });
</script>
</body>
</html>
