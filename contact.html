<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root { --primary-color: #dc3545; }
        .nav-link:hover { border-bottom: 2px solid #dc3545; color: #dc3545 !important; }
        .contact-icon { font-size: 2rem; color: #dc3545; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><span class="text-danger">Sport Store</span></a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto me-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Produk</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Tentang</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Kontak</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html"><i class="fas fa-shopping-cart"></i> <span id="cart-item-count" class="badge bg-danger rounded-pill d-none"></span></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="text-center fw-bold mb-5">Hubungi Kami</h2>
        <div class="row g-4 text-center mb-5">
            <div class="col-md-4">
                <i class="fas fa-map-marker-alt contact-icon"></i>
                <h6>Alamat Toko</h6>
                <p class="text-muted">Jl. Sport Center No. 10, Jakarta</p>
            </div>
            <div class="col-md-4">
                <i class="fas fa-phone contact-icon"></i>
                <h6>Telepon</h6>
                <p class="text-muted">+62 812 3456 7890</p>
            </div>
            <div class="col-md-4">
                <i class="fas fa-envelope contact-icon"></i>
                <h6>Email</h6>
                <p class="text-muted">info@sportstore.com</p>
            </div>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm p-4">
                    <form>
                        <div class="row mb-3">
                            <div class="col"><label class="form-label">Nama</label><input type="text" class="form-control" placeholder="Nama Anda"></div>
                            <div class="col"><label class="form-label">Email</label><input type="email" class="form-control" placeholder="email@contoh.com"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pesan</label>
                            <textarea class="form-control" rows="4" placeholder="Tulis pesan Anda..."></textarea>
                        </div>
                        <button class="btn btn-danger w-100 py-2">Kirim Pesan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Common Cart Functions (ditempatkan di setiap halaman yang membutuhkan)
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        function getCart() {
            const cart = localStorage.getItem('sportStoreCart');
            return cart ? JSON.parse(cart) : [];
        }

        function saveCart(cart) {
            localStorage.setItem('sportStoreCart', JSON.stringify(cart));
            updateCartIcon();
        }

        function addToCart(product) {
            let cart = getCart();
            const existingItemIndex = cart.findIndex(item => item.id === product.id && item.size === product.size);

            if (existingItemIndex > -1) {
                cart[existingItemIndex].quantity += product.quantity;
            } else {
                cart.push(product);
            }
            saveCart(cart);
            // alert(`${product.name} (Ukuran: ${product.size}, Jumlah: ${product.quantity}) ditambahkan ke keranjang!`);
            // Bisa diganti dengan Bootstrap Toast atau SweetAlert
        }

        function updateCartItemQuantity(productId, size, newQuantity) {
            let cart = getCart();
            const itemIndex = cart.findIndex(item => item.id === productId && item.size === size);

            if (itemIndex > -1) {
                if (newQuantity <= 0) {
                    cart.splice(itemIndex, 1);
                } else {
                    cart[itemIndex].quantity = newQuantity;
                }
            }
            saveCart(cart);
        }

        function removeCartItem(productId, size) {
            let cart = getCart();
            cart = cart.filter(item => !(item.id === productId && item.size === size));
            saveCart(cart);
        }

        function getCartTotalItems() {
            return getCart().reduce((total, item) => total + item.quantity, 0);
        }

        function updateCartIcon() {
            const cartItemCountSpan = document.getElementById('cart-item-count');
            if (cartItemCountSpan) {
                const totalItems = getCartTotalItems();
                cartItemCountSpan.textContent = totalItems > 0 ? totalItems : '';
                cartItemCountSpan.classList.toggle('d-none', totalItems === 0);
            }
        }

        document.addEventListener('DOMContentLoaded', updateCartIcon);
    </script>
    <footer class="bg-dark text-white text-center py-3">
        <div class="container"><p class="mb-0">&copy; 2026 Sport Store. Semua hak dilindungi.</p></div>
    </footer>
</body>
</html>
