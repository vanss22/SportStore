<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sport Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-3">Login Sport Store</h2>
                        <p class="text-center text-muted mb-4">Masukkan username dan password untuk melanjutkan.</p>

                        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-danger">Login</button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <a href="index.html" class="text-decoration-none">Kembali ke beranda</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('loginAlert');

            if (!username || !password) {
                alertBox.textContent = 'Isi username dan password terlebih dahulu.';
                alertBox.classList.remove('d-none');
                return;
            }

            localStorage.setItem('sportStoreLoggedIn', 'true');
            window.location.href = 'index.html';
        });
    </script>
    <script src="auth.js"></script>
    <script>
        if (localStorage.getItem('sportStoreLoggedIn') === 'true') {
            window.location.href = 'index.html';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
